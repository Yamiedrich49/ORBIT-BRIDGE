@keyframes momo-breathe{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-1.1px) scale(1.015,.989)}}
@keyframes momo-ear-1{0%,33%,95%,100%{transform:rotate(0deg)}37%{transform:rotate(-8deg)}40%{transform:rotate(2deg)}43%{transform:rotate(0deg)}}
@keyframes momo-ear-2{0%,67%,100%{transform:rotate(0deg)}70%{transform:rotate(8deg)}73%{transform:rotate(-3deg)}76%{transform:rotate(0deg)}}
@keyframes momo-blink{0%,43%,46%,100%{opacity:0}44%,45%{opacity:1}}
@keyframes momo-eye-hide{0%,43%,46%,100%{opacity:1}44%,45%{opacity:0}}

function renderSpeed(){const q=cfg();if(!q.chooseSpeed){$('speed-control').innerHTML='';return}const select=state.speedB;const pill=(x,num,label)=>`<g data-speed="${num}" role="button" tabindex="0" aria-label="オレンジのはやさ ${label}" style="cursor:pointer"><rect x="${x}" y="506" width="79" height="24" rx="12" fill="${select===num?'#f4a776':'#fff'}" stroke="${select===num?'#f4a776':'#dce9e4'}" stroke-width="1.5"/><text x="${x+39.5}" y="522" text-anchor="middle" font-size="11" font-weight="900" fill="${select===num?'#fff':'#869c98'}">${label}</text></g>`;$('speed-control').innerHTML=`<text x="200" y="496" text-anchor="middle" font-size="10" font-weight="850" fill="#93aba6">オレンジの はやさ</text>${pill(111,1,'ふつう')}${pill(203,2,'2ばい')}`;}
function resetMotion(){state.attemptId++;state.running=false;state.clock=0;state.win=false;state.actorRide=null;state.actorX=57;state.actorY=yAt(startH())-28;state.actorHop=0;state.error=null;state.wonFx=false;state.peek=true;state.preview=false;state.lastFeedback='';$('future').classList.remove('active');$('future').disabled=false;$('board-notice').className='board-notice';$('play').classList.remove('win');$('play').disabled=false;$('play').innerHTML='しゅっぱつ！ <span>→</span>';}
function loadLevel(i){state.level=clamp(i,0,LEVELS.length-1);const q=cfg();state.phaseA=q.ia;state.phaseB=q.ib??0;state.speedB=q.initialSpeed??q.sb??1;resetMotion();state.interacted=false;$('counter').textContent=`${String(i+1).padStart(2,'0')} / 10`;$('chapter').textContent=i<4?'CHAPTER 01 · はしの ひみつ':i<7?'CHAPTER 02 · ふたつの まる':'CHAPTER 03 · はやさの ひみつ';$('headline').textContent=q.title;$('description').textContent=q.caption;$('steps').innerHTML=LEVELS.map((_,n)=>`<span class="${n<i?'done':n===i?'current':''}"></span>`).join('');$('hintline').className='hintline';$('hintline').textContent='';scene()}
const valid=(testLevel=state.level)=>{const q=LEVELS[testLevel],a=state.phaseA,b=state.phaseB,sp=state.speedB,start=Math.sin(rad(q.a)),goal=Math.sin(rad(q.dual?q.b+q.sb*90*q.tend:q.a+q.sa*90*q.tend));const y=(p,s,t)=>Math.sin(rad(p)+s*Math.PI/2*t);return near(y(a,q.sa,0),start)&&(!q.dual||near(y(a,q.sa,q.transfer),y(b,sp,q.transfer)))&&near(q.dual?y(b,sp,q.tend):y(a,q.sa,q.tend),goal)};
const getAngle=(x,y,cx,cy)=>Math.atan2(cy-y,x-cx);
let drag=null;
function pointerStart(e){snapSerial++;const wheelEl=e.target.closest('[data-wheel]');if(!wheelEl||state.running||state.win||state.preview)return;const which=wheelEl.dataset.wheel;if(which==='b'&&!cfg().dual)return;e.preventDefault();const rect=$('board-svg').getBoundingClientRect(),sx=400/rect.width,sy=532/rect.height,c=coords();const px=(e.clientX-rect.left)*sx,py=(e.clientY-rect.top)*sy,xc=which==='a'?c.xa:c.xb;const init=getAngle(px,py,xc,c.ry);drag={which,id:e.pointerId,prev:init,phase:which==='a'?state.phaseA:state.phaseB,notch:Math.round((which==='a'?state.phaseA:state.phaseB)/45)};$('board-svg').setPointerCapture(e.pointerId);playNote(520,.016,.06)}
function pointerMove(e){if(!drag||drag.id!==e.pointerId)return;e.preventDefault();const rect=$('board-svg').getBoundingClientRect(),sx=400/rect.width,sy=532/rect.height,c=coords(),xc=drag.which==='a'?c.xa:c.xb;const a=getAngle((e.clientX-rect.left)*sx,(e.clientY-rect.top)*sy,xc,c.ry);let delta=a-drag.prev;if(delta>Math.PI)delta-=TAU;if(delta< -Math.PI)delta+=TAU;drag.prev=a;drag.phase+=delta/D;const key=drag.which==='a'?'phaseA':'phaseB';state[key]=mod(drag.phase);state.interacted=true;state.lastFeedback='';const notch=Math.round(drag.phase/45);if(notch!==drag.notch){drag.notch=notch;tactileClick()}scene()}
let snapSerial=0;
function pointerEnd(e){if(!drag||e.pointerId!==drag.id)return;const key=drag.which==='a'?'phaseA':'phaseB',from=drag.phase,to=Math.round(from/45)*45;drag=null;const token=++snapSerial;const start=performance.now();
 function settle(now){if(token!==snapSerial)return;const t=clamp((now-start)/165,0,1),ease=1-Math.pow(1-t,3);state[key]=mod(from+(to-from)*ease);scene();if(t<1)requestAnimationFrame(settle);else{state[key]=mod(to);scene();tactileClick(true)}}requestAnimationFrame(settle)}
$('board-svg').addEventListener('pointerdown',e=>{if(e.target.closest('[data-speed]')){if(state.running||state.win||state.preview)return;const p=e.target.closest('[data-speed]');state.speedB=Number(p.dataset.speed);state.lastFeedback='';scene();tactileClick();textNote('はやさが 変わった！');return}pointerStart(e)});
$('board-svg').addEventListener('pointermove',pointerMove);$('board-svg').addEventListener('pointerup',pointerEnd);$('board-svg').addEventListener('pointercancel',pointerEnd);
$('board-svg').addEventListener('keydown',e=>{const sp=e.target.closest('[data-speed]');if(sp&&['Enter',' '].includes(e.key)){e.preventDefault();state.speedB=Number(sp.dataset.speed);scene();tactileClick();return}const el=e.target.closest('[data-wheel]');if(!el||state.running||state.win||state.preview)return;if(['ArrowLeft','ArrowDown','ArrowRight','ArrowUp'].includes(e.key)){e.preventDefault();const which=el.dataset.wheel,key=which==='a'?'phaseA':'phaseB';state[key]=mod(state[key]+(['ArrowLeft','ArrowDown'].includes(e.key)?-45:45));state.interacted=true;state.lastFeedback='';scene();tactileClick()}});
function tween(ms,fn,id){return new Promise(resolve=>{const start=performance.now();const dur=Math.max(1,ms*(window.__BRIDGE_TEST_SPEED??1));const step=now=>{if(id!==state.attemptId){resolve(false);return}const t=clamp((now-start)/dur,0,1);fn(t);scene();if(t>=1)resolve(true);else requestAnimationFrame(step)};requestAnimationFrame(step)})}
async function walk(to,ms,id){const from=state.actorX;return tween(ms,t=>{const ease=t*t*(3-2*t);state.actorX=from+(to-from)*ease;state.actorHop=10*Math.abs(Math.sin(t*Math.PI*2))},id)}
async function rotate(from,to,id,ride){state.actorRide=ride;return tween((to-from)*1030,t=>{state.clock=from+(to-from)*t;state.actorHop=0},id)}
async function fail(message,at,id){if(id!==state.attemptId)return;state.error=at;state.lastFeedback=message;missSound();textNote(message,'bad');popup('おしい！','bad',670);scene();await sleep(800);if(id!==state.attemptId)return;state.running=false;state.clock=0;$('future').disabled=false;state.actorX=57;state.actorY=yAt(startH())-28;state.actorHop=0;state.actorRide=null;state.error=null;$('play').disabled=false;scene();}
async function run(){if(state.running||state.preview)return;if(state.win){loadLevel(state.level===LEVELS.length-1?0:state.level+1);playNote(784,.025,.10);return}const q=cfg();state.attemptId++;const id=state.attemptId;state.running=true;state.peek=true;state.error=null;state.lastFeedback='';$('future').classList.remove('active');$('future').disabled=false;$('play').disabled=true;textNote('いくよ！','good');scene();await sleep(120);if(id!==state.attemptId)return;
if(!near(height('a',0),startH())){await fail('左の地面と 橋の高さが ちがうよ',[xLandL(),yAt(startH()),xA()-28,yAt(height('a',0))],id);return}
state.actorRide=null;await walk(xA(),430,id);if(id!==state.attemptId)return;playNote(587,.017,.08);
if(q.dual){await rotate(0,q.transfer,id,'a');if(id!==state.attemptId)return;const ya=yAt(height('a',q.transfer)),yb=yAt(height('b',q.transfer));if(!near(height('a',q.transfer),height('b',q.transfer))){state.actorRide=null;await fail('のりかえるとき、2つの橋の 高さがちがうよ',[xA()+28,ya,xB()-28,yb],id);return}state.actorRide=null;playNote(740,.02,.11);await walk(xB(),400,id);if(id!==state.attemptId)return;await rotate(q.transfer,q.tend,id,'b')}
else await rotate(0,q.tend,id,'a');if(id!==state.attemptId)return;
const last=height(q.dual?'b':'a',q.tend);if(!near(last,goalH())){state.actorRide=null;await fail('右のゴールと、橋の高さが ちがうよ',[q.dual?xB()+28:xA()+36,yAt(last),xLandR(),yAt(goalH())],id);return}
state.actorRide=null;await walk(xLandR()+24,530,id);if(id!==state.attemptId)return;state.running=false;$('future').disabled=false;state.win=true;state.actorHop=0;state.wonFx=true;scene();winSound();popup('やった！ つながった！','good',1400);textNote('うまくいった！ つぎの橋へ','good');$('play').classList.add('win');$('play').disabled=false;updateGuide();try{localStorage.setItem('orbitBridgeUnlocked',String(Math.max(Number(localStorage.getItem('orbitBridgeUnlocked'))||0,state.level+1)))}catch{}
}
$('play').addEventListener('click',run);
$('reset').addEventListener('click',()=>{loadLevel(state.level);playNote(494,.024,.09)});
$('future').addEventListener('click',async()=>{
 if(state.running||state.win||state.preview)return;
 state.preview=true;state.clock=0;
 const id=++state.attemptId;
 $('future').disabled=true;$('play').disabled=true;
 playNote(588,.013,.11);
 scene();
 const destination=cfg().dual?cfg().transfer:cfg().tend;
 await tween(Math.min(1650,650*destination),t=>{state.clock=t*destination},id);
 if(id!==state.attemptId)return;
 await sleep(170);
 await tween(380,t=>{state.clock=destination*(1-t)},id);
 if(id!==state.attemptId)return;
 state.clock=0;state.preview=false;
 $('future').disabled=false;$('play').disabled=false;
 scene();
});
$('sound').addEventListener('click',()=>{soundOn=!soundOn;$('sound-waves').style.display=soundOn?'':'none';$('sound').setAttribute('aria-label',soundOn?'音を消す':'音をつける');if(soundOn)playNote(784,.02,.1)});
loadLevel(0);
window.__orbitBridgeTest={LEVELS,state,loadLevel,scene,valid,run,solve(i){loadLevel(i);state.phaseA=LEVELS[i].a;state.phaseB=LEVELS[i].b??0;state.speedB=LEVELS[i].sb??1;scene();},setSpeed(x){state.speedB=x;scene()}};
</script>
